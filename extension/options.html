<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>漫画日译中 · 设置</title>
<style>
  :root { color-scheme: light dark; --bg:#f6f6f4; --card:#fff; --fg:#1d1d1f; --muted:#6e6e73; --line:#d9d9de; --accent:#0a6cff; --ok:#1a8f3c; --err:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1c1e; --card:#2c2c2e; --fg:#f2f2f7; --muted:#a1a1a6; --line:#3a3a3c; --accent:#4c8dff; --ok:#4cc96d; --err:#ff6b6b; } }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.55 -apple-system, "PingFang SC", sans-serif; }
  main { max-width:640px; margin:0 auto; padding:28px 16px 60px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  section { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px 18px; margin-bottom:16px; }
  h2 { font-size:15px; margin:0 0 12px; }
  label { display:block; margin:12px 0 4px; font-weight:600; }
  label:first-of-type { margin-top:0; }
  input[type=text], input[type=password], select { width:100%; box-sizing:border-box; padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  .hint { color:var(--muted); font-size:12px; margin-top:4px; }
  .row { display:flex; gap:10px; align-items:center; }
  .choice { display:flex; gap:8px; align-items:flex-start; margin:8px 0; font-weight:normal; }
  .choice input { margin-top:4px; }
  button { padding:8px 14px; border-radius:8px; border:1px solid var(--line); background:var(--card); color:inherit; font:inherit; cursor:pointer; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#fff; }
  #ai[hidden] { display:none; }
  #result { margin-top:10px; white-space:pre-wrap; font-size:13px; }
  #result.ok { color:var(--ok); } #result.err { color:var(--err); }
  #saved { color:var(--ok); font-size:13px; opacity:0; transition:opacity .3s; }
  kbd { border:1px solid var(--line); border-radius:4px; padding:0 4px; font-size:12px; }
</style>
</head>
<body>
<main>
  <h1>漫画日译中</h1>
  <p class="sub">点击 Safari 工具栏的扩展按钮开启或关闭自动翻译；翻页后会自动翻译新页面。按住 <kbd>⌥ Option</kbd> 可临时隐藏译文看原文。</p>

  <section>
    <h2>翻译引擎</h2>
    <label class="choice"><input type="radio" name="engine" value="apple"> <span><b>苹果系统翻译</b>（免费、离线，偏直译）</span></label>
    <label class="choice"><input type="radio" name="engine" value="ai"> <span><b>AI 大模型</b>（需要 API key；整页联系上下文翻译，语气更自然，人名前后统一）</span></label>

    <div id="ai">
      <label for="preset">服务商</label>
      <select id="preset">
        <option value="https://dashscope.aliyuncs.com/compatible-mode/v1|qwen3.7-flash">阿里云百炼 · qwen3.7-flash（推荐；有专属工作空间地址可改填）</option>
        <option value="">自定义（任何 OpenAI 兼容接口）</option>
        <option value="https://api.deepseek.com/v1|deepseek-chat">DeepSeek</option>
        <option value="https://dashscope.aliyuncs.com/compatible-mode/v1|qwen-plus">通义千问（阿里云百炼；如有专属工作空间地址请改填）</option>
        <option value="https://api.moonshot.cn/v1|">Kimi（月之暗面）</option>
        <option value="https://open.bigmodel.cn/api/paas/v4|">智谱 GLM</option>
        <option value="https://ark.cn-beijing.volces.com/api/v3|">豆包（火山方舟，模型填接入点 ID）</option>
        <option value="https://api.siliconflow.cn/v1|">硅基流动</option>
        <option value="https://api.openai.com/v1|">OpenAI</option>
        <option value="https://generativelanguage.googleapis.com/v1beta/openai|">Google Gemini</option>
        <option value="https://openrouter.ai/api/v1|">OpenRouter</option>
        <option value="http://localhost:11434/v1|">本机 Ollama</option>
      </select>

      <label for="baseUrl">接口地址（Base URL）</label>
      <input id="baseUrl" type="text" placeholder="https://api.example.com/v1" autocomplete="off" spellcheck="false">
      <div class="hint">填到 <code>/v1</code> 这一级即可，插件会自动拼上 <code>/chat/completions</code>。</div>

      <label for="apiKey">API Key</label>
      <input id="apiKey" type="password" placeholder="sk-..." autocomplete="off" spellcheck="false">
      <div class="hint">只保存在本机 Safari 扩展存储中，只发送给上面填写的接口地址。</div>

      <label for="model">模型名称</label>
      <input id="model" type="text" placeholder="以服务商控制台显示的模型名为准" autocomplete="off" spellcheck="false">

      <label class="choice"><input id="sendImage" type="checkbox"> <span>同时发送页面图片（模型能看到画面，可纠正识别错字、判断说话人和语气；<b>需模型支持看图</b>，费用更高）</span></label>

      <div class="row" style="margin-top:12px">
        <button id="test" type="button">测试连接</button>
      </div>
      <div id="result"></div>
    </div>
  </section>

  <section>
    <h2>译文显示</h2>
    <label class="choice"><input type="radio" name="style" value="auto"> <span><b>自适应（推荐）</b>：文字周围是纯色（如白色气泡）时用同色悄悄盖住日文，不出现方框；文字压在画面上时改用透明描边，不遮挡画面</span></label>
    <label class="choice"><input type="radio" name="style" value="outline"> <span><b>透明</b>：无背景，文字带白色描边，不遮挡画面</span></label>
    <label class="choice"><input type="radio" name="style" value="soft"> <span><b>半透明</b>：柔和白底，盖住大部分日文</span></label>
    <label class="choice"><input type="radio" name="style" value="solid"> <span><b>白底</b>：完全盖住原文（适合白色气泡）</span></label>
    <label for="fontScale">字号</label>
    <div class="row"><input id="fontScale" type="range" min="0.6" max="1.6" step="0.05" style="flex:1"><span id="fontScaleValue"></span></div>
  </section>

  <div class="row"><button id="save" class="primary" type="button">保存</button><span id="saved">已保存</span></div>
</main>
<script src="options.js"></script>
</body>
</html>
