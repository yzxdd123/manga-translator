    <h2>漫画日译中</h2>
    <p>这个 App 只是 Safari 扩展的“外壳”，无需打开使用。</p>
    <ol>
        <li>打开“设置” → App → Safari → 扩展 → 漫画日译中，打开开关，并允许访问 read.amazon.co.jp。</li>
        <li>在 Safari 打开 Kindle 网页版漫画，点地址栏左侧的“页面菜单” → 漫画日译中，开启自动翻译。</li>
        <li>首次使用请在扩展设置里填写 AI 接口的 API Key。</li>
    </ol>
</body>
